# pf-voice.conf — pf rule to let the UwUNet voice server receive players.
#
# The voice server (server/src/voice/voice-server.ts) binds UDP :8470 DIRECTLY — no
# redirect is needed (unlike the edge, which rdr's 443->8443 / 80->8460 because it
# can't bind 443 rootlessly). We advertise "<ip>:8470" in VoiceConnectionInfo, so the
# client dials UDP 8470 and we just need pf to pass it in.
#
# ⚠ DO NOT `pfctl -f` THIS FILE ON ITS OWN — that would REPLACE your whole ruleset and
#   drop the 443/80 redirects. MERGE the rule below into your existing /etc/pf.conf
#   (see the apply steps at the bottom), then reload the merged file.
#
# ---------------------------------------------------------------------------
# The rule — add these two lines to /etc/pf.conf alongside your other pass/rdr
# rules. `ext_if` is your OVH public interface (usually vtnet0 — confirm with
# `ifconfig`). If you already define an ext_if macro, reuse it and skip the macro
# line here. `quick` makes voice match-and-stop so a later block can't shadow it;
# pf keeps UDP state so the server's replies back to the player are allowed.
# ---------------------------------------------------------------------------

voice_if   = "vtnet0"       # <- your public interface; `ifconfig` to confirm
voice_port = "8470"

pass in quick on $voice_if proto udp to port $voice_port keep state

# ---------------------------------------------------------------------------
# Apply (run on the VPS as root — all of this is the VPS side, pf needs privilege):
#
#   sudo cp /etc/pf.conf /etc/pf.conf.bak-$(date +%s)   # back up first
#   # append the two `voice_*` lines + the `pass in quick ...` line above into
#   # /etc/pf.conf, next to your existing pass rules (keep the rdr rules intact),
#   # then reload the WHOLE merged file:
#   sudo pfctl -nf /etc/pf.conf     # parse-check only; must print nothing/no error
#   sudo pfctl -f  /etc/pf.conf     # load it
#   sudo pfctl -sr | grep 8470      # verify the voice pass rule is present
#
# OVH also has a stateless "Network Firewall" in the control panel. If you have it
# ENABLED, add a rule permitting UDP to port 8470 there too (if it's disabled, pf
# alone is enough). Being stateless, OVH's firewall needs UDP explicitly allowed in
# both directions if you turn it on — easiest is to leave it off and rely on pf.
#
# Not sure how to merge safely? Paste your current /etc/pf.conf and I'll hand back
# the exact merged file so there's no guesswork.
